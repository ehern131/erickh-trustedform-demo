<!-- TrustedForm -->
<script type="text/javascript">
  (function() {
    var tf = document.createElement('script');
    tf.type = 'text/javascript';
    tf.async = true;
    tf.src = ("https:" === document.location.protocol ? "https" : "http") +
      "://api.trustedform.com/trustedform.js?field=xxTrustedFormCertUrl&ping_field=xxTrustedFormPingUrl&l=" +
      new Date().getTime() + Math.random();

    var s = document.getElementsByTagName('script')[0];
    s.parentNode.insertBefore(tf, s);
  })();
</script>
<noscript>
  <img src="https://api.trustedform.com/ns.gif" />
</noscript>
<!-- End TrustedForm -->

<!-- Submission Script -->
<script>
  const form = document.getElementById('form');
  const submitButton = form.querySelector('button[type="submit"]');
  const certField = form.querySelector('input[name="xxTrustedFormCertUrl"]');

  // Start disabled until TrustedForm cert is available
  submitButton.disabled = true;
  submitButton.textContent = "Loading...";

  function enableSubmitWhenReady() {
    if (certField && certField.value && certField.value.trim() !== "") {
      submitButton.disabled = false;
      submitButton.textContent = "Submit";
      return true;
    }
    return false;
  }

  // Check immediately in case it is already present
  if (!enableSubmitWhenReady()) {
    // Poll briefly until TrustedForm populates the field
    const tfInterval = setInterval(() => {
      if (enableSubmitWhenReady()) {
        clearInterval(tfInterval);
      }
    }, 250);

    // Stop polling after 10 seconds
    setTimeout(() => clearInterval(tfInterval), 10000);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    if (!certField || !certField.value || certField.value.trim() === "") {
      alert("TrustedForm certificate is still loading. Please wait a few seconds and try again.");
      return;
    }

    const formData = new FormData(form);
    const encodedData = new URLSearchParams(formData);

    const productionURL = "https://app.leadconduit.com/flows/62e29ba78962ae06cd22baf1/sources/62e29d0578222f03b466728a/submit";
    const stagingURL = "https://app.leadconduit-staging.com/flows/6877ce8553b8d8dac0264a7c/sources/600f049548231b06fae160a0/submit";
    const newPostingURL = "https://app.leadconduit.com/flows/69e248a7b8a23540092d1fec/sources/69e24836f88a774c6f2d7627/submit";

    console.log("TrustedForm Cert URL:", certField.value);

    const requests = [
      fetch(`${productionURL}?redir_url=https://ehern131.github.io/erickh-trustedform-demo/submission`, {
        method: 'POST',
        body: encodedData
      }),
      fetch(stagingURL, {
        method: 'POST',
        body: encodedData
      }),
      fetch(newPostingURL, {
        method: 'POST',
        body: encodedData
      })
    ];

    Promise.allSettled(requests).then(results => {
      console.log("Submission results:", results);
      window.location.href = "https://ehern131.github.io/erickh-trustedform-demo/submission";
    });
  });
</script>
